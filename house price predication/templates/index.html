<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Regression Model Prediction</title>

    <link rel="stylesheet" href="https://maxcdn.bootstrapcdn.com/bootstrap/4.0.0/css/bootstrap.min.css">

    <style>
        body {
            background-color: #f4f7fb;
            font-family: Arial, sans-serif;
        }

        .container {
            max-width: 850px;
            background-color: white;
            margin-top: 35px;
            margin-bottom: 35px;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 18px rgba(0, 0, 0, 0.10);
        }

        h1 {
            color: #212529;
            font-weight: bold;
            font-size: 38px;
        }

        .house-image {
            text-align: center;
            margin: 25px 0;
        }

        .house-image img {
            width: 280px;
            max-width: 100%;
            max-height: 250px;
            height: auto;
            object-fit: contain;
            border-radius: 12px;
        }

        label {
            font-weight: 600;
            color: #343a40;
        }

        .form-control {
            height: 45px;
            border-radius: 7px;
        }

        .btn {
            border-radius: 7px;
            padding: 10px;
        }

        .btn-primary {
            background-color: #0d6efd;
            border-color: #0d6efd;
        }

        .btn-secondary {
            margin-top: 5px;
        }
    </style>
</head>

<body>

    <div class="container">

        <h1 class="text-center mt-3">
            House Price Prediction
        </h1>

        <!-- House Image -->
        {% if house_image %}
        <div class="house-image">
            <img src="data:image/jpeg;base64,{{ house_image }}" alt="House Price Prediction">
        </div>
        {% endif %}

        <!-- Prediction Form -->
        <form action="/predict" method="POST" class="mt-4">

            <div class="form-group">
                <label for="income">Average Area Income:</label>
                <input type="number" step="any" class="form-control" id="income" name="Avg. Area Income"
                    placeholder="Enter average area income" required>
            </div>

            <div class="form-group">
                <label for="age">Average Area House Age:</label>
                <input type="number" step="any" class="form-control" id="age" name="Avg. Area House Age"
                    placeholder="Enter average house age" required>
            </div>

            <div class="form-group">
                <label for="rooms">Average Area Number of Rooms:</label>
                <input type="number" step="any" class="form-control" id="rooms" name="Avg. Area Number of Rooms"
                    placeholder="Enter number of rooms" required>
            </div>

            <div class="form-group">
                <label for="bedrooms">
                    Average Area Number of Bedrooms:
                </label>
                <input type="number" step="any" class="form-control" id="bedrooms" name="Avg. Area Number of Bedrooms"
                    placeholder="Enter number of bedrooms" required>
            </div>

            <div class="form-group">
                <label for="population">Area Population:</label>
                <input type="number" step="any" class="form-control" id="population" name="Area Population"
                    placeholder="Enter area population" required>
            </div>

            <div class="form-group">
                <label for="model">Select Regression Model:</label>

                <select class="form-control" id="model" name="model" required>
                    {% for model_name in model_names %}
                    <option value="{{ model_name }}">
                        {{ model_name }}
                    </option>
                    {% endfor %}
                </select>
            </div>

            <button type="submit" class="btn btn-primary btn-block">
                Predict House Price
            </button>

        </form>

        <!-- Model Evaluation Button -->
        <div class="text-center mt-4">
            <a href="/results" class="btn btn-secondary">
                View Model Evaluation Results
            </a>
        </div>

    </div>

</body>

</html>
